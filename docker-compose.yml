# ==============================================================================
# OenGo Driver Telematics & Mission Service — Standalone Stack
# ==============================================================================

version: "3.8"

services:
  oengo-driver:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oengo-driver-standalone
    ports:
      - "3010:3010"
    environment:
      PORT: "3010"
      NODE_ENV: production
      OENGO_API_URL: ${OENGO_API_URL:-http://localhost:3001}
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3010/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
